# Replace the address and certificate paths before enabling this site.
# Only HTTPS. Certificate validation/renewal is handled separately.
server {
    listen 443 ssl;
    server_name music.example.com;
    ssl_certificate /etc/tingyu-tls/certificate.crt;
    ssl_certificate_key /etc/tingyu-tls/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 205m;
    access_log /var/log/nginx/tingyu-access.log;
    error_log /var/log/nginx/tingyu-error.log;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
    }
}
